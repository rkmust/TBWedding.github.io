<style id="lockcss">
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#f6ebd4;color:#2b2826;font-family:"Outfit",system-ui,sans-serif;font-size:16px;line-height:1.45}
.lock{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px 22px;max-width:420px;margin:0 auto;text-align:center}
.lmark{font-family:"Bowlby One","Arial Black",Impact,sans-serif;font-size:56px;display:flex;align-items:center;gap:8px;line-height:1}
.lmark svg{width:30px;height:48px;fill:#d9603a;stroke:#2b2826;stroke-width:.8}
.lnote{font-family:"Permanent Marker",cursive;color:#d9603a;font-size:20px;text-transform:uppercase;transform:rotate(-2deg)}
.lcard{width:100%;background:#fbf4e3;border:3px solid #2b2826;border-radius:16px;padding:18px;box-shadow:4px 4px 0 #2b2826;display:flex;flex-direction:column;gap:12px;text-align:left}
.lcard label{font-weight:700}
.lcard input{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:3px solid #2b2826;border-radius:12px;background:#fff;color:#2b2826}
.lcard button{font:inherit;font-family:"Bowlby One","Arial Black",sans-serif;font-size:18px;text-transform:uppercase;padding:12px;border:3px solid #2b2826;border-radius:999px;background:#f5d73b;color:#2b2826;box-shadow:3px 3px 0 #2b2826;cursor:pointer;min-height:50px}
.lcard button:active{transform:translate(3px,3px);box-shadow:none}
.lcard button:disabled{opacity:.6}
.lcard input:focus-visible,.lcard button:focus-visible{outline:3px solid #2aa3c7;outline-offset:2px}
#lmsg{font-weight:600;color:#b23a1c;min-height:1.4em;font-size:15px}
.lsmall{font-size:14px;opacity:.7}
</style>
</head>

      document.getElementById('lockcss').remove();
      var st=document.createElement('style');st.textContent=p.css;document.head.appendChild(st);
      document.title='Bri & Tas Wedding Weekend';
      document.body.innerHTML=p.body;
      var sc=document.createElement('script');sc.textContent=p.js;document.body.appendChild(sc);
    });
  }
  function fail(e){
    go.disabled=false;go.textContent='Let me in';
    msg.textContent=(e&&e.message==='nocrypto')?'This browser cannot unlock the page. Open the link in Safari or Chrome.':'That is not it. Check the spelling and try again.';
    input.select();
  }
  function submit(){
    if(go.disabled)return;
    if(!input.value){msg.textContent='Type the password first.';return;}
    msg.textContent='';go.disabled=true;go.textContent='Unlocking';
    var pass=input.value;
    try{open(pass).then(function(){try{localStorage.setItem('tb-key',pass);}catch(e){}},fail);}catch(e){fail(e);}
  }
  go.addEventListener('click',submit);
  input.addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();submit();}});
  var saved=null;try{saved=localStorage.getItem('tb-key');}catch(e){}
  if(saved)open(saved).catch(function(){try{localStorage.removeItem('tb-key');}catch(e){}});
})();
</script>
</body>
</html>
